<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Graph Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Math.js for safe expression parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper" id="appWrapper">
        <header class="top-header">
            <div class="brand-area">
                <div class="brand-logo">∿</div>
                <div class="brand-titles">
                    <h1>MATHGRAPH</h1>
                    <h2>MATHEMATICAL GRAPHING ENGINE</h2>
                </div>
            </div>
            <div class="header-controls">
                <button id="btnToggleExamples" class="header-btn">Examples</button>
                <button id="btnFocusModeHeader" class="header-btn icon-btn" title="Focus Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                </button>
            </div>
        </header>

        <div class="main-workspace">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-top">
                    <div class="section-title">
                        <h2>EXPRESSIONS</h2>
                        <button id="btnAddEquation" class="add-btn" title="Add Expression">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                </div>

                <div class="equations-scroll-area">
                    <div id="emptyState" class="beautiful-empty-state active">
                        <div class="empty-icon">∿</div>
                        <h3>Explore mathematics</h3>
                        <p>Plot equations, curves and<br>mathematical relationships.</p>
                        <button id="btnEmptyAdd" class="premium-btn mt-4">
                            <span>+</span> Add expression
                        </button>
                        <button class="premium-btn ghost mt-2" onclick="document.getElementById('btnToggleExamples').click()">
                            Explore examples
                        </button>
                    </div>
                    
                    <div id="equationList" class="equation-list">
                        <!-- Items injected here -->
                    </div>
                </div>

                <div class="sidebar-bottom">
                    <!-- Animation Controls -->
                    <div class="anim-panel">
                        <div class="anim-header">
                            <span class="status-indicator"><span class="dot"></span> Rendering ready</span>
                        </div>
                        <div class="playback-controls">
                            <button id="btnPlay" class="ctrl-btn" title="Play">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            </button>
                            <button id="btnPause" class="ctrl-btn" title="Pause">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                            </button>
                            <button id="btnResetAnim" class="ctrl-btn" title="Restart">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                            </button>
                        </div>
                        <div class="speed-slider-wrap">
                            <input type="range" id="speedSlider" class="premium-slider" min="1" max="100" value="50">
                        </div>
                    </div>
                </div>
            </aside>

            <main class="graph-area">
                <button id="btnMobileMenu" class="mobile-menu-btn" title="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>

                <!-- Used by app.js for focus mode -->
                <button id="btnFocusMode" style="display:none;"></button>
                <button id="btnMobileClose" style="display:none;"></button>

                <div class="canvas-container" id="canvasContainer">
                    <canvas id="graphCanvas"></canvas>
                    
                    <div class="graph-toolbar">
                        <button class="tool-btn" title="Zoom In" onclick="simulateWheel(-1)">+</button>
                        <button class="tool-btn" title="Zoom Out" onclick="simulateWheel(1)">−</button>
                        <button id="btnResetView" class="tool-btn" title="Reset View">⟳</button>
                    </div>
                    
                    <div id="crosshairX" class="crosshair crosshair-x"></div>
                    <div id="crosshairY" class="crosshair crosshair-y"></div>
                    <div id="coordOverlay" class="premium-coord-hud">
                        <div class="coord-row"><span class="coord-lbl">x</span><span class="coord-val" id="hudX">0.000</span></div>
                        <div class="coord-row"><span class="coord-lbl">y</span><span class="coord-val" id="hudY">0.000</span></div>
                    </div>
                </div>
                
                <div id="loadingOverlay" class="loading-overlay hidden">
                    <span class="spinner"></span> Rendering...
                </div>
            </main>
        </div>

        <!-- Examples Popover -->
        <div id="examplesPanel" class="examples-panel hidden">
            <div class="examples-panel-inner">
                <div class="examples-header">
                    <h2>EXPLORE EXAMPLES</h2>
                    <button id="btnCloseExamples" class="icon-btn close-examples"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                </div>
                <div class="examples-grid">
                    <div class="example-column">
                        <h3>CURVES</h3>
                        <button class="preset-btn" data-eq="y = sin(x)"><span class="preset-icon">∿</span> Sine Wave</button>
                        <button class="preset-btn" data-eq="y = x^2"><span class="preset-icon">∪</span> Parabola</button>
                        <button class="preset-btn" data-eq="y = 1/x"><span class="preset-icon">⤡</span> Hyperbola</button>
                        
                        <h3 class="mt-4">VERTICAL</h3>
                        <button class="preset-btn" data-eq="x = y^2"><span class="preset-icon">⊂</span> Sideways Parabola</button>
                    </div>
                    <div class="example-column">
                        <h3>IMPLICIT</h3>
                        <button class="preset-btn" data-eq="x^2 + y^2 = 25"><span class="preset-icon">○</span> Circle</button>
                        <button class="preset-btn" data-eq="(x^2 + y^2 - 1)^3 = x^2*y^3"><span class="preset-icon">♥</span> Heart</button>
                        <button class="preset-btn" data-eq="x^2/9 + y^2/4 = 1"><span class="preset-icon">⬭</span> Ellipse</button>
                    </div>
                    <div class="example-column">
                        <h3>PARAMETRIC</h3>
                        <button class="preset-btn" data-eq="x = cos(t), y = sin(t)"><span class="preset-icon">○</span> Parametric Circle</button>
                        <button class="preset-btn" data-eq="x = 16sin(t)^3, y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)"><span class="preset-icon">♥</span> Parametric Heart</button>
                        <button class="preset-btn" data-eq="x = sin(3t)*cos(t), y = sin(3t)*sin(t)"><span class="preset-icon">✿</span> Petals</button>
                    </div>
                    <div class="example-column">
                        <h3>POLAR</h3>
                        <button class="preset-btn" data-eq="r = 1 + cos(theta)"><span class="preset-icon">◉</span> Cardioid</button>
                        <button class="preset-btn" data-eq="r = sin(3theta)"><span class="preset-icon">✿</span> Rose Curve</button>
                        <button class="preset-btn" data-eq="r = 2cos(2theta)"><span class="preset-icon">❀</span> 4-Petal Rose</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Template for Equation Item -->
    <template id="equationTemplate">
        <div class="equation-item">
            <div class="eq-color-bar"></div>
            <div class="eq-content">
                <div class="eq-top-row">
                    <div class="eq-color-indicator"></div>
                    <div class="eq-input-wrapper">
                        <input type="text" class="eq-input" placeholder="e.g. y = sin(x)" spellcheck="false">
                        <div class="eq-error-tooltip">Invalid expression</div>
                    </div>
                    <div class="eq-actions">
                        <button class="eq-icon-btn eq-toggle" title="Toggle Visibility">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-visible"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-hidden" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                        <button class="eq-icon-btn eq-remove" title="Remove">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                <div class="eq-bottom-row">
                    <div class="eq-type-badge">TYPE</div>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="js/app.js"></script>
    <script>
        // Inline helper for graph toolbar zoom buttons
        function simulateWheel(direction) {
            const container = document.querySelector('.graph-area');
            const event = new WheelEvent('wheel', {
                deltaY: direction * 100,
                clientX: container.getBoundingClientRect().left + container.clientWidth / 2,
                clientY: container.getBoundingClientRect().top + container.clientHeight / 2
            });
            container.dispatchEvent(event);
        }
    </script>
</body>
</html>

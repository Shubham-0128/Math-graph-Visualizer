<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Graph Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Math.js for safe expression parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for Equation Management -->
        <aside class="sidebar" id="sidebar">
            <header class="sidebar-header">
                <h1>MathGraph</h1>
                <div class="header-controls">
                    <button id="btnToggleExamples" class="text-button">Examples</button>
                    <button id="btnMobileClose" class="icon-button mobile-only" title="Close Sidebar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </header>
            
            <div class="equations-section">
                <div class="section-header">
                    <h2>Expressions</h2>
                    <button id="btnAddEquation" class="icon-button" title="Add Expression">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>
                
                <div id="emptyState" class="empty-state">
                    <p>Explore mathematics.</p>
                    <p>Enter an equation or choose an example.</p>
                    <button id="btnEmptyAdd" class="action-button mt-2">+ Add expression</button>
                </div>
                
                <div id="equationList" class="equation-list">
                    <!-- Equation items will be injected here -->
                </div>
            </div>

            <div class="controls-section">
                <h2>Animation</h2>
                <div class="playback-controls">
                    <button id="btnPlay" class="control-button" title="Play">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </button>
                    <button id="btnPause" class="control-button" title="Pause">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>
                    <button id="btnResetAnim" class="control-button" title="Restart">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                    </button>
                </div>
                <div class="speed-control">
                    <label for="speedSlider">Speed</label>
                    <input type="range" id="speedSlider" min="1" max="100" value="50">
                </div>
            </div>
            
            <div id="examplesPanel" class="examples-panel hidden">
                <div class="panel-header">
                    <h2>Gallery</h2>
                    <button id="btnCloseExamples" class="icon-button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                </div>
                <div class="examples-content">
                    <div class="example-group">
                        <h3>Explicit</h3>
                        <button class="preset-btn" data-eq="y = sin(x)">Sine Wave</button>
                        <button class="preset-btn" data-eq="y = x^2">Parabola</button>
                        <button class="preset-btn" data-eq="y = 1/x">Hyperbola</button>
                    </div>
                    <div class="example-group">
                        <h3>Vertical</h3>
                        <button class="preset-btn" data-eq="x = y^2">Sideways Parabola</button>
                    </div>
                    <div class="example-group">
                        <h3>Implicit</h3>
                        <button class="preset-btn" data-eq="x^2 + y^2 = 25">Circle</button>
                        <button class="preset-btn" data-eq="(x^2 + y^2 - 1)^3 = x^2*y^3">Heart</button>
                        <button class="preset-btn" data-eq="x^2/9 + y^2/4 = 1">Ellipse</button>
                    </div>
                    <div class="example-group">
                        <h3>Parametric</h3>
                        <button class="preset-btn" data-eq="x = cos(t), y = sin(t)">Parametric Circle</button>
                        <button class="preset-btn" data-eq="x = 16sin(t)^3, y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)">Parametric Heart</button>
                    </div>
                    <div class="example-group">
                        <h3>Polar</h3>
                        <button class="preset-btn" data-eq="r = 1 + cos(theta)">Cardioid</button>
                        <button class="preset-btn" data-eq="r = sin(3theta)">Rose Curve</button>
                        <button class="preset-btn" data-eq="r = 2cos(2theta)">4-Petal Rose</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Graph Area -->
        <main class="graph-area">
            <!-- Mobile Menu Toggle -->
            <button id="btnMobileMenu" class="icon-button overlay-btn top-left mobile-only" title="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            
            <div class="canvas-container" id="canvasContainer">
                <canvas id="graphCanvas"></canvas>
                
                <!-- Overlay for View Controls -->
                <div class="view-controls">
                    <button id="btnFocusMode" class="icon-button" title="Toggle Focus Mode">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    </button>
                    <button id="btnResetView" class="icon-button" title="Reset View (Home)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    </button>
                </div>
                
                <!-- Crosshair & Coordinate Overlay -->
                <div id="crosshairX" class="crosshair crosshair-x"></div>
                <div id="crosshairY" class="crosshair crosshair-y"></div>
                <div id="coordOverlay" class="coord-overlay"></div>
            </div>
            
            <!-- Global feedback overlay -->
            <div id="loadingOverlay" class="loading-overlay hidden">Rendering...</div>
        </main>
    </div>

    <!-- Template for Equation Item -->
    <template id="equationTemplate">
        <div class="equation-item">
            <div class="eq-header">
                <div class="eq-color-indicator"></div>
                <div class="eq-type-badge">TYPE</div>
                <div class="eq-actions">
                    <button class="icon-button eq-toggle" title="Toggle Visibility">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-visible"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-hidden" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                    <button class="icon-button eq-remove" title="Remove">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div class="eq-input-wrapper">
                <input type="text" class="eq-input" placeholder="e.g. y = sin(x)" spellcheck="false">
                <div class="eq-error-tooltip">Invalid expression</div>
            </div>
        </div>
    </template>

    <script type="module" src="js/app.js"></script>
</body>
</html>
